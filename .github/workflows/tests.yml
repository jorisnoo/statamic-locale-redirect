name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        statamic: ['5', '6']

    name: Statamic ${{ matrix.statamic }} / PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: composer update --with "statamic/cms:^${{ matrix.statamic }}.0" --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/pest

  required:
    name: Package checks
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "$MATRIX_RESULT" = success
        env:
          MATRIX_RESULT: ${{ needs.tests.result }}
